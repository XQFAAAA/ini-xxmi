; ----------------------------------------------------------------------
; ini-xxmi grammar fixture — covers 3DMigoto + XXMI extended INI syntax
; ----------------------------------------------------------------------

[Loader]
; comment line
target = Game.exe
loader = XXMI Launcher.exe
module = d3d11.dll

[Include]
include_recursive = Mods
exclude_recursive = DISABLED*

[Constants]
global $my_variable = 0.0
global locked $locked_var = 1.23
global persist $persist_var = 1
x = 0.8
y1 = 3
z180 = 0.5
w180 = 1.0
X2 = 2.0

[System]
screen_width = 1920
screen_height = 1080
load_library_redirect = 2

[Rendering]
shader_hash = 3dmigoto
override_directory = ShaderFixes
ini_params = 120

[Hunting]
hunting = 0
marking_mode = skip
marking_actions = hlsl, asm, clipboard
next_pixelshader = no_modifiers NO_VK_DECIMAL VK_NUMPAD2
mark_vertexbuffer = no_modifiers VK_RETURN VK_DIVIDE
take_screenshot = no_modifiers VK_SNAPSHOT

[Logging]
log_level = disabled
show_warnings = 0

[KeyToggleExample]
Key = q
type = toggle
y = 0.0

[KeyCycleExample]
Key = E
Back = Q
type = cycle
wrap = false
z = 0.25, 0.5, 0.75
transition = 100

[Present]
post x = 0
post ResourceDepthBuffer = null

[CommandListFoo]
if $foo == 0 && cursor_showing
    $foo = $bar * 3.14 / rt_width
else
    $foo = 0
endif
run = CommandListUnbindAllRenderTargets
run = CommandList\WWMIv1\RegisterMod
run = CustomShader\WWMIv1\SkeletonMerger
run = CustomShaderAA
run = BuiltInCustomShaderDisableScissorClipping

[CommandListProxy]
CommandListA = ref CommandListB
CommandListA = null

[ResourceFoo]
type = Buffer
filename = Foo.buf
stride = 42
format = R32_FLOAT
data = "Hello World!"

[PoolFoo]
pool_size = 4
pool_index_type = ring
type = Buffer
data = "Hello World!"

[PoolBarFIFO]
pool_size = 2
pool_index_type = fifo
PoolBarFIFO[1.0] = ref ResourceFoo
PoolBarFIFO[$object_id] = copy ResourceFoo

[ShaderOverride1]
Hash = 69732c4f23cb6c48
Handling = skip
run = CommandListFoo
x = 2.0
x1 = rt_width
local $partner = vs
model = vs_5_0
preset = PresetExample

[TextureOverride1]
Hash = c3e55ebd

[TextureOverrideUAVNotRT]
match_type = Texture2D
match_width = height * 16 / 9
match_height = !res_height
match_msaa = >1
match_bind_flags = +unordered_access -render_target
match_priority = -1

[CustomShader1]
run = CommandListFoo
vs-t0 = ref ResourceFoo
o0 = copy vs-cb0->Region($byte_offset, $byte_size)
cs-cb0 = copy vs-cb0

[ResourceBar]
type = Buffer
format = R16G16B16A16_UINT

[PoolSpatial]
pool_size = 8
pool_index_type = fifo
pool_spatial_radius = 3
pool_persist_variables = 1

; ----------------------------------------------------------------------
; XXMI expression / variable features
; ----------------------------------------------------------------------
[Constants2]
global $bin = 0b01010111
global $hex = 0x1F
global $menu
global locked $menu2 ; no initializer
global $flag = 1 << 3
global $mask = ~0b1111 & 0xFF
global $value = countbits($bin) + random(10)
$draw = DRAW_NUMBER
$frame = FRAME_NUMBER + 1
$time = TIME
$fps = FPS
$sqrt_val = sqrt(2.0)
$frac_val = frac(1.5)
$pow = 2 ** 10
$div = 7 // 2
$win_w = window_width
$cursor = cursor_x
$scissor = scissor0_left
$dpi = effective_dpi
$stereo = stereo_active

[StoreExample]
store = $out, ResourceFoo, 4
store = $out2, vs-cb0, $offset + 1

; ----------------------------------------------------------------------
; Resource metadata and pool metadata
; ----------------------------------------------------------------------
[MetadataExample]
$resource_id = @ResourceFoo
$slot_id = @vs-t0
$offset = vs-cb0->Offset
$size = ResourceFoo->Size
$stride = ResourceFoo->Stride
$source_stride = PoolFoo[0]->SourceStride
$element0 = $PoolFoo[0]
$pool_size = #PoolFoo
$pool_index = #PoolFoo[7]
$fifo_index = #PoolBarFIFO[123.456]
if @ResourceFoo
    run = CommandListFoo
endif

; ----------------------------------------------------------------------
; Input layout overrides (XXMI)
; ----------------------------------------------------------------------
[InputLayoutExample]
vb0->ElementFormat(BLENDINDICES, 0) = R16G16B16A16_UINT
vb0->ElementOffset(BLENDWEIGHTS, 0) = 8

; ----------------------------------------------------------------------
; ShaderRegex sections with raw pattern / replace / declarations
; ----------------------------------------------------------------------
[ShaderRegex1]
shader_model = ps_4_0 ps_5_0
temps = stereo tmp1

[ShaderRegex1.Pattern]
mul r\d+\.xyzw, r\d+\.yyyy, cb0\[28\]\.xyzw\n
mad r\d+\.xyzw, (?P<pos_x>r\d+)\.(?P<swizzle_x>[xyzw])[xyzw]{3}, cb0\[27\]\.xyzw, r\d+\.xyzw\n
[xyzw]{2} r\d+\.wwww\n

[ShaderRegex1.Pattern.Replace]
\n
;// UE4 shadow correction:\n
ld_indexable(texture2d)(float,float,float,float) ${stereo}.xyzw, l(0, 0, 0, 0), t125.xyzw\n
${0}

[ShaderRegex1.InsertDeclarations]
dcl_resource_texture2d (float,float,float,float) t125

; ----------------------------------------------------------------------
; Namespaced variable
; ----------------------------------------------------------------------
[Constants3]
$\ShaderFixes\3dvision2sbs.ini\mode = 0

; ----------------------------------------------------------------------
; XXMI enums, copy options & resource member suffixes
; ----------------------------------------------------------------------
[ResourceEnumExample]
type = ByteAddressBuffer
misc_flags = shared, texturecube, generate_mips
color_space = Linear
format = dxgi_format_32

[CustomShaderCompile]
compile_flags = debug, skip_validation, optimization_level3
vs-cb0 = copy vs-cb0->HashRegion(0, 16), unless_null
o0 = copy vs-cb0, set_viewport, raw, no_view_cache
$cb_mask = vs->cb_mask
$srv_stride = ps->srv_stride(0)
$region = ResourceFoo->Region(0, 16)
$source_stride = PoolFoo[0]->SourceStride

; Empty section header
[]
