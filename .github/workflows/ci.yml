name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Grammar snapshot tests
        run: npm test
      - name: Parser smoke tests
        run: npm run test:parser
      - name: Diagnostics smoke tests
        run: npm run test:diagnostics
      - name: Formatting smoke tests
        run: npm run test:format
